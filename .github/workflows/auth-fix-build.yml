name: Auth Fix Build Check

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_INSFORGE_BASE_URL: https://insforge.example.invalid
      NEXT_PUBLIC_INSFORGE_ANON_KEY: ci-placeholder-anon-key
      INSFORGE_API_KEY: ci-placeholder-admin-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
