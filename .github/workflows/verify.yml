name: Verify application
on:
  pull_request:
  push:
    branches: [main, 'fix/**']
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm audit --audit-level=high
      - run: npm run build
        env:
          NEXT_PUBLIC_INSFORGE_BASE_URL: https://insforge.example.invalid
          NEXT_PUBLIC_INSFORGE_ANON_KEY: build-validation-anon
          NEXT_PUBLIC_SUPABASE_URL: https://insforge.example.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-validation-anon
          NEXT_PUBLIC_APP_URL: https://example.invalid
